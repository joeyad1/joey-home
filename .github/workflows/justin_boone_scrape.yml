name: Justin Boone Scrape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./justin_boone_scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        working-directory: ./justin_boone_scraper
        run: python scraper.py --once

      - name: Commit CSV output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add justin_boone_scraper/data
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "Update Justin Boone CSV outputs"
            git push
          fi
