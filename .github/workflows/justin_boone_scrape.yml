name: Justin Boone Scrape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Justin Boone dependencies
        working-directory: ./justin_boone_scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Justin Boone scraper
        working-directory: ./justin_boone_scraper
        run: python scraper.py --once

      - name: Install Sleeper script dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build Sleeper roster snapshot
        working-directory: ./sleeperScripts
        run: python boone_sleeper_integration.py

      - name: Build waiver and start/sit recommendations
        working-directory: ./sleeperScripts
        run: python waiver_and_start_sit.py

      - name: Build trade value analysis
        working-directory: ./sleeperScripts
        run: python trade_value_analysis.py

      - name: Build league dashboard
        working-directory: ./sleeperScripts
        run: python league_dashboard.py

      - name: Commit CSV outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add justin_boone_scraper/data sleeperScripts/data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update Justin Boone and Sleeper outputs"
            git push
          fi
